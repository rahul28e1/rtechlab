<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320">
  <defs>
    <linearGradient id="pcbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a140d"/>
      <stop offset="100%" stop-color="#040705"/>
    </linearGradient>
    <linearGradient id="goldPin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe27a"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="metalBracket" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a2a30"/>
      <stop offset="50%" stop-color="#4a4a52"/>
      <stop offset="100%" stop-color="#2a2a30"/>
    </linearGradient>
  </defs>

  <!-- Background Matte -->
  <rect width="800" height="320" fill="#0c0d12"/>
  
  <!-- Left Half: LGA Socket Inspection -->
  <g transform="translate(20, 20)">
    <!-- Socket Frame -->
    <rect width="360" height="260" rx="12" fill="url(#pcbBg)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4"/>
    <rect x="25" y="25" width="310" height="210" rx="6" fill="#141419" stroke="#333" stroke-width="1"/>
    
    <!-- Title Label -->
    <text x="180" y="50" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">REAL HARDWARE: LGA 1700 SOCKET</text>
    <text x="180" y="66" text-anchor="middle" fill="#888" font-family="sans-serif" font-size="10">Macro Inspection: 1,700 Gold Spring Pins</text>

    <!-- Simulated Pin Array Matrix -->
    <g fill="url(#goldPin)" opacity="0.85">
      <!-- Row 1 -->
      <circle cx="60" cy="95" r="3"/><circle cx="85" cy="95" r="3"/><circle cx="110" cy="95" r="3"/><circle cx="135" cy="95" r="3"/><circle cx="160" cy="95" r="3"/><circle cx="185" cy="95" r="3"/><circle cx="210" cy="95" r="3"/><circle cx="235" cy="95" r="3"/><circle cx="260" cy="95" r="3"/><circle cx="285" cy="95" r="3"/>
      <!-- Row 2 -->
      <circle cx="60" cy="115" r="3"/><circle cx="85" cy="115" r="3"/><circle cx="110" cy="115" r="3"/><circle cx="135" cy="115" r="3"/><circle cx="160" cy="115" r="3"/><circle cx="185" cy="115" r="3"/><circle cx="210" cy="115" r="3"/><circle cx="235" cy="115" r="3"/><circle cx="260" cy="115" r="3"/><circle cx="285" cy="115" r="3"/>
      <!-- Row 3 (Bent pin demo) -->
      <circle cx="60" cy="135" r="3"/><circle cx="85" cy="135" r="3"/><circle cx="110" cy="135" r="3"/>
      <!-- BENT PIN IN RED -->
      <path d="M 132 138 L 140 131" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
      <circle cx="160" cy="135" r="3"/><circle cx="185" cy="135" r="3"/><circle cx="210" cy="135" r="3"/><circle cx="235" cy="135" r="3"/><circle cx="260" cy="135" r="3"/><circle cx="285" cy="135" r="3"/>
      <!-- Row 4 -->
      <circle cx="60" cy="155" r="3"/><circle cx="85" cy="155" r="3"/><circle cx="110" cy="155" r="3"/><circle cx="135" cy="155" r="3"/><circle cx="160" cy="155" r="3"/><circle cx="185" cy="155" r="3"/><circle cx="210" cy="155" r="3"/><circle cx="235" cy="155" r="3"/><circle cx="260" cy="155" r="3"/><circle cx="285" cy="155" r="3"/>
      <!-- Row 5 -->
      <circle cx="60" cy="175" r="3"/><circle cx="85" cy="175" r="3"/><circle cx="110" cy="175" r="3"/><circle cx="135" cy="175" r="3"/><circle cx="160" cy="175" r="3"/><circle cx="185" cy="175" r="3"/><circle cx="210" cy="175" r="3"/><circle cx="235" cy="175" r="3"/><circle cx="260" cy="175" r="3"/><circle cx="285" cy="175" r="3"/>
    </g>

    <!-- Callout Box for Bent Pin -->
    <rect x="75" y="195" width="210" height="26" rx="4" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1"/>
    <text x="180" y="212" text-anchor="middle" fill="#fca5a5" font-family="monospace" font-size="10" font-weight="bold">⚠ Bent Pin Detected at Pin B-14</text>
  </g>

  <!-- Right Half: Real CPU Substrate Inspection -->
  <g transform="translate(420, 20)">
    <!-- CPU Substrate Frame -->
    <rect width="360" height="260" rx="12" fill="#0d1117" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.4"/>
    <rect x="25" y="25" width="310" height="210" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>

    <!-- Title Label -->
    <text x="180" y="50" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="12" font-weight="bold">CPU BOTTOM: GOLD LAND PADS</text>
    <text x="180" y="66" text-anchor="middle" fill="#888" font-family="sans-serif" font-size="10">Substrate Contacts (Zero Pins on CPU)</text>

    <!-- Simulated Gold Pads Matrix -->
    <g fill="#eab308" opacity="0.9">
      <!-- Capacitor Array in Center -->
      <rect x="135" y="110" width="90" height="60" rx="4" fill="#332211" stroke="#eab308" stroke-width="1"/>
      <text x="180" y="145" text-anchor="middle" fill="#d97706" font-family="monospace" font-size="9">SMD Capacitors</text>

      <!-- Pad Clusters -->
      <rect x="60" y="90" width="12" height="12" rx="2"/><rect x="80" y="90" width="12" height="12" rx="2"/><rect x="100" y="90" width="12" height="12" rx="2"/>
      <rect x="60" y="110" width="12" height="12" rx="2"/><rect x="80" y="110" width="12" height="12" rx="2"/><rect x="100" y="110" width="12" height="12" rx="2"/>
      <rect x="60" y="130" width="12" height="12" rx="2"/><rect x="80" y="130" width="12" height="12" rx="2"/><rect x="100" y="130" width="12" height="12" rx="2"/>
      <rect x="60" y="150" width="12" height="12" rx="2"/><rect x="80" y="150" width="12" height="12" rx="2"/><rect x="100" y="150" width="12" height="12" rx="2"/>

      <rect x="245" y="90" width="12" height="12" rx="2"/><rect x="265" y="90" width="12" height="12" rx="2"/><rect x="285" y="90" width="12" height="12" rx="2"/>
      <rect x="245" y="110" width="12" height="12" rx="2"/><rect x="265" y="110" width="12" height="12" rx="2"/><rect x="285" y="110" width="12" height="12" rx="2"/>
      <rect x="245" y="130" width="12" height="12" rx="2"/><rect x="265" y="130" width="12" height="12" rx="2"/><rect x="285" y="130" width="12" height="12" rx="2"/>
      <rect x="245" y="150" width="12" height="12" rx="2"/><rect x="265" y="150" width="12" height="12" rx="2"/><rect x="285" y="150" width="12" height="12" rx="2"/>
    </g>

    <!-- Triangle Notch Keying -->
    <polygon points="35,35 45,35 35,45" fill="#eab308"/>
    <text x="50" y="45" fill="#eab308" font-family="monospace" font-size="9" font-weight="bold">Pin 1 Notch</text>

    <!-- Safe Handling Note -->
    <rect x="65" y="195" width="230" height="26" rx="4" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1"/>
    <text x="180" y="212" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="10" font-weight="bold">✓ Clean Pads with 99% Isopropyl Alcohol</text>
  </g>

  <!-- Bottom Caption -->
  <text x="400" y="305" text-anchor="middle" fill="#666" font-family="monospace" font-size="10">RTechLab Industrial Hardware Diagnostics · Figure 1.2: LGA 1700 Socket vs Substrate Physical Contacts</text>
</svg>
