<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <linearGradient id="ramPcb" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a1a0f"/>
      <stop offset="50%" stop-color="#12331c"/>
      <stop offset="100%" stop-color="#0a1a0f"/>
    </linearGradient>
    <linearGradient id="goldPins" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="300" fill="#090a0f"/>

  <!-- Top Container: DDR4 -->
  <g transform="translate(30, 25)">
    <!-- Header -->
    <text x="0" y="16" fill="#ef4444" font-family="monospace" font-size="12" font-weight="bold">DDR4 SDRAM ARCHITECTURE (288 PINS · 1.2V · SINGLE 64-BIT CHANNEL)</text>
    <text x="740" y="16" text-anchor="end" fill="#888" font-family="monospace" font-size="9">Legacy Architecture</text>
    
    <!-- Stick Body -->
    <rect x="0" y="25" width="740" height="60" rx="4" fill="url(#ramPcb)" stroke="#ef4444" stroke-width="1.2" stroke-opacity="0.6"/>
    
    <!-- Memory Chips -->
    <g fill="#1a1a24" stroke="#333" stroke-width="1">
      <rect x="50" y="33" width="55" height="35" rx="2"/>
      <rect x="130" y="33" width="55" height="35" rx="2"/>
      <rect x="210" y="33" width="55" height="35" rx="2"/>
      <rect x="290" y="33" width="55" height="35" rx="2"/>
      <rect x="390" y="33" width="55" height="35" rx="2"/>
      <rect x="470" y="33" width="55" height="35" rx="2"/>
      <rect x="550" y="33" width="55" height="35" rx="2"/>
      <rect x="630" y="33" width="55" height="35" rx="2"/>
    </g>

    <!-- Gold Pins Bottom Edge with Notch at X=365 (Shifted Left) -->
    <rect x="10" y="80" width="345" height="10" fill="url(#goldPins)"/>
    <!-- Keying Notch (Cutout) -->
    <rect x="355" y="70" width="16" height="20" fill="#090a0f"/>
    <text x="363" y="66" text-anchor="middle" fill="#ef4444" font-family="monospace" font-size="8" font-weight="bold">NOTCH: 72.25mm</text>
    <rect x="371" y="80" width="359" height="10" fill="url(#goldPins)"/>

    <text x="180" y="55" fill="#ef4444" font-family="monospace" font-size="10" font-weight="bold">SINGLE 64-BIT BUS (NO ON-DIE ECC)</text>
  </g>

  <!-- Divider Line -->
  <line x1="30" y1="145" x2="770" y2="145" stroke="#333" stroke-dasharray="4"/>

  <!-- Bottom Container: DDR5 -->
  <g transform="translate(30, 160)">
    <!-- Header -->
    <text x="0" y="16" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">DDR5 SDRAM ARCHITECTURE (288 PINS · 1.1V · DUAL 32-BIT SUB-CHANNELS)</text>
    <text x="740" y="16" text-anchor="end" fill="#10b981" font-family="monospace" font-size="9">2027 Enterprise Standard</text>
    
    <!-- Stick Body -->
    <rect x="0" y="25" width="740" height="60" rx="4" fill="url(#ramPcb)" stroke="#10b981" stroke-width="1.5"/>
    
    <!-- On-Die PMIC Power Chip (DDR5 Exclusive!) -->
    <rect x="345" y="30" width="50" height="25" rx="3" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5"/>
    <text x="370" y="44" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="8" font-weight="bold">ON-DIE</text>
    <text x="370" y="52" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="7">PMIC 1.1V</text>

    <!-- Memory Chips Subchannel A (Left) -->
    <g fill="#1a1a24" stroke="#10b981" stroke-width="1" stroke-opacity="0.4">
      <rect x="40" y="33" width="55" height="35" rx="2"/>
      <rect x="110" y="33" width="55" height="35" rx="2"/>
      <rect x="180" y="33" width="55" height="35" rx="2"/>
      <rect x="250" y="33" width="55" height="35" rx="2"/>
    </g>
    <text x="145" y="20" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold">SUBCHANNEL A (32-BIT + 8-BIT ECC)</text>

    <!-- Memory Chips Subchannel B (Right) -->
    <g fill="#1a1a24" stroke="#10b981" stroke-width="1" stroke-opacity="0.4">
      <rect x="430" y="33" width="55" height="35" rx="2"/>
      <rect x="500" y="33" width="55" height="35" rx="2"/>
      <rect x="570" y="33" width="55" height="35" rx="2"/>
      <rect x="640" y="33" width="55" height="35" rx="2"/>
    </g>
    <text x="535" y="20" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold">SUBCHANNEL B (32-BIT + 8-BIT ECC)</text>

    <!-- Gold Pins Bottom Edge with Notch at X=390 (Shifted Right) -->
    <rect x="10" y="80" width="375" height="10" fill="url(#goldPins)"/>
    <!-- Keying Notch (Cutout shifted right) -->
    <rect x="385" y="70" width="16" height="20" fill="#090a0f"/>
    <text x="393" y="66" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="8" font-weight="bold">NOTCH: 77.25mm</text>
    <rect x="401" y="80" width="329" height="10" fill="url(#goldPins)"/>

    <text x="370" y="105" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="9" font-weight="bold">⚠️ MECHANICAL INTERLOCK: DDR4 &amp; DDR5 NOTCHES ARE 5mm APART — CAN NEVER BE CROSS-INSERTED!</text>
  </g>
</svg>