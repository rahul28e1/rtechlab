<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="100%" height="100%" style="background:#F8FAFC; border-radius:6px; font-family:'Segoe UI',Roboto,Helvetica,sans-serif;">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E2E8F0" stroke-width="0.8"/>
    </pattern>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="720" height="220" fill="url(#grid)" rx="6"/>
  <!-- Status Bar / Packet Tracer Canvas Header -->
  <rect x="0" y="0" width="720" height="24" fill="#0F172A" rx="6 6 0 0"/>
  <circle cx="14" cy="12" r="4" fill="#EF4444"/>
  <circle cx="26" cy="12" r="4" fill="#F59E0B"/>
  <circle cx="38" cy="12" r="4" fill="#10B981"/>
  <text x="54" y="16" fill="#94A3B8" font-size="11" font-weight="600" font-family="monospace">Cisco Packet Tracer v8.2 · Real-Time Physical Workspace</text>
  <rect x="610" y="4" width="102" height="16" fill="#1E293B" rx="3"/>
  <text x="616" y="15" fill="#38BDF8" font-size="9.5" font-family="monospace">● Link Status: UP</text>
  
  <line x1="130" y1="65" x2="300" y2="100" stroke="#059669" stroke-width="2.5" /><polygon points="138,61 138,69 145,65" fill="#10B981"/><polygon points="292,96 292,104 285,100" fill="#10B981"/><text x="148" y="59" fill="#475569" font-size="9" font-weight="600" font-family="monospace">Fa0/1</text><text x="262" y="94" fill="#475569" font-size="9" font-weight="600" font-family="monospace">Fa0/10</text><rect x="150.0" y="64.5" width="130" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="215.0" y="77.5" text-anchor="middle" fill="#047857" font-size="9" font-weight="700" font-family="monospace">VLAN 10 (Sales)</text>
  <line x1="130" y1="145" x2="300" y2="100" stroke="#2563EB" stroke-width="2.5" /><polygon points="138,141 138,149 145,145" fill="#10B981"/><polygon points="292,96 292,104 285,100" fill="#10B981"/><text x="148" y="139" fill="#475569" font-size="9" font-weight="600" font-family="monospace">Fa0/1</text><text x="262" y="94" fill="#475569" font-size="9" font-weight="600" font-family="monospace">Fa0/20</text><rect x="150.0" y="104.5" width="130" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="215.0" y="117.5" text-anchor="middle" fill="#047857" font-size="9" font-weight="700" font-family="monospace">VLAN 20 (Eng)</text>
  <line x1="370" y1="100" x2="520" y2="100" stroke="#7C3AED" stroke-width="2.5" /><polygon points="378,96 378,104 385,100" fill="#10B981"/><polygon points="512,96 512,104 505,100" fill="#10B981"/><text x="388" y="94" fill="#475569" font-size="9" font-weight="600" font-family="monospace">Gi0/1</text><text x="482" y="94" fill="#475569" font-size="9" font-weight="600" font-family="monospace">Gi0/0/0</text><rect x="380.0" y="82.0" width="130" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="445.0" y="95.0" text-anchor="middle" fill="#047857" font-size="9" font-weight="700" font-family="monospace">802.1Q ROAS Trunk</text>
  
    <g transform="translate(70,40)" filter="url(#shadow)">
