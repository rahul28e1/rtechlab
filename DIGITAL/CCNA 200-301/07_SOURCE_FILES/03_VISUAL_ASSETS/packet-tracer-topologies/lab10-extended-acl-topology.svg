<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="100%" height="100%" style="background:#F8FAFC; border-radius:6px; font-family:'Segoe UI',Roboto,Helvetica,sans-serif;">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E2E8F0" stroke-width="0.8"/>
    </pattern>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="720" height="220" fill="url(#grid)" rx="6"/>
  <!-- Status Bar / Packet Tracer Canvas Header -->
  <rect x="0" y="0" width="720" height="24" fill="#0F172A" rx="6 6 0 0"/>
  <circle cx="14" cy="12" r="4" fill="#EF4444"/>
  <circle cx="26" cy="12" r="4" fill="#F59E0B"/>
  <circle cx="38" cy="12" r="4" fill="#10B981"/>
  <text x="54" y="16" fill="#94A3B8" font-size="11" font-weight="600" font-family="monospace">Cisco Packet Tracer v8.2 · Real-Time Physical Workspace</text>
  <rect x="610" y="4" width="102" height="16" fill="#1E293B" rx="3"/>
  <text x="616" y="15" fill="#38BDF8" font-size="9.5" font-family="monospace">● Link Status: UP</text>
  
  <line x1="90" y1="65" x2="250" y2="100" stroke="#EF4444" stroke-width="2.5" /><polygon points="98,61 98,69 105,65" fill="#10B981"/><polygon points="242,96 242,104 235,100" fill="#10B981"/><text x="108" y="59" fill="#475569" font-size="9" font-weight="600" font-family="monospace">NIC</text><text x="212" y="94" fill="#475569" font-size="9" font-weight="600" font-family="monospace">Gi0/0.50</text><rect x="105.0" y="64.5" width="130" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="170.0" y="77.5" text-anchor="middle" fill="#047857" font-size="9" font-weight="700" font-family="monospace">Guest VLAN 50 (DENIED HTTP/S)</text>
  <line x1="90" y1="145" x2="250" y2="100" stroke="#10B981" stroke-width="2.5" /><polygon points="98,141 98,149 105,145" fill="#10B981"/><polygon points="242,96 242,104 235,100" fill="#10B981"/><text x="108" y="139" fill="#475569" font-size="9" font-weight="600" font-family="monospace">NIC</text><text x="212" y="94" fill="#475569" font-size="9" font-weight="600" font-family="monospace">Gi0/0.10</text><rect x="105.0" y="104.5" width="130" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="170.0" y="117.5" text-anchor="middle" fill="#047857" font-size="9" font-weight="700" font-family="monospace">Staff VLAN 10 (PERMITTED)</text>
  <line x1="320" y1="100" x2="500" y2="100" stroke="#2563EB" stroke-width="2.5" /><polygon points="328,96 328,104 335,100" fill="#10B981"/><polygon points="492,96 492,104 485,100" fill="#10B981"/><text x="338" y="94" fill="#475569" font-size="9" font-weight="600" font-family="monospace">Gi0/0/1</text><text x="462" y="94" fill="#475569" font-size="9" font-weight="600" font-family="monospace">NIC</text><rect x="345.0" y="82.0" width="130" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="410.0" y="95.0" text-anchor="middle" fill="#047857" font-size="9" font-weight="700" font-family="monospace">Corporate Server Farm</text>
  
    <g transform="translate(30,40)" filter="url(#shadow)">
      <rect x="5" y="5" width="50" height="34" rx="3" fill="#334155" stroke="#1E293B" stroke-width="2"/>
      <rect x="9" y="9" width="42" height="26" fill="#38BDF8"/>
      <polygon points="22,39 38,39 42,47 18,47" fill="#64748B"/>
      <rect x="12" y="47" width="36" height="3" rx="1" fill="#475569"/>
      <text x="30" y="64" text-anchor="middle" fill="#0F172A" font-size="11" font-weight="700">Guest Laptop</text>
      <text x="30" y="76" text-anchor="middle" fill="#0284C7" font-size="8.5" font-family="monospace">192.168.50.15</text>
    </g>
  
    <g transform="translate(30,120)" filter="url(#shadow)">
      <rect x="5" y="5" width="50" height="34" rx="3" fill="#334155" stroke="#1E293B" stroke-width="2"/>
      <rect x="9" y="9" width="42" height="26" fill="#38BDF8"/>
      <polygon points="22,39 38,39 42,47 18,47" fill="#64748B"/>
      <rect x="12" y="47" width="36" height="3" rx="1" fill="#475569"/>
      <text x="30" y="64" text-anchor="middle" fill="#0F172A" font-size="11" font-weight="700">Staff Workstation</text>
      <text x="30" y="76" text-anchor="middle" fill="#0284C7" font-size="8.5" font-family="monospace">192.168.10.15</text>
    </g>
  
    <g transform="translate(250,70)" filter="url(#shadow)">
      <circle cx="35" cy="35" r="30" fill="#0284C7" stroke="#0369A1" stroke-width="2.5"/>
      <path d="M 20 35 L 50 35 M 35 20 L 35 50 M 23 23 L 47 47 M 23 47 L 47 23" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="35" cy="35" r="7" fill="#0284C7" stroke="#FFFFFF" stroke-width="2"/>
      <text x="35" y="77" text-anchor="middle" fill="#0F172A" font-size="11.5" font-weight="700">R1-BORDER</text>
      <text x="35" y="90" text-anchor="middle" fill="#64748B" font-size="9" font-family="monospace">ACL 105 Applied IN</text>
    </g>
  <!-- Server box -->
  <g transform="translate(500, 65)" filter="url(#shadow)">
    <rect x="0" y="0" width="70" height="50" rx="4" fill="#1E293B" stroke="#0EA5E9" stroke-width="2"/>
    <line x1="10" y1="12" x2="60" y2="12" stroke="#38BDF8" stroke-width="2"/>
    <line x1="10" y1="24" x2="60" y2="24" stroke="#38BDF8" stroke-width="2"/>
    <line x1="10" y1="36" x2="60" y2="36" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="58" cy="12" r="2" fill="#10B981"/>
    <circle cx="58" cy="24" r="2" fill="#10B981"/>
    <text x="35" y="65" text-anchor="middle" fill="#0F172A" font-size="10.5" font-weight="700">Corp Server</text>
    <text x="35" y="78" text-anchor="middle" fill="#0284C7" font-size="8.5" font-family="monospace">10.1.1.100</text>
  </g>

</svg>