<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="100%" height="100%" style="background:#F8FAFC; border-radius:6px; font-family:'Segoe UI',Roboto,Helvetica,sans-serif;">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E2E8F0" stroke-width="0.8"/>
    </pattern>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="720" height="220" fill="url(#grid)" rx="6"/>
  <!-- Status Bar / Packet Tracer Canvas Header -->
  <rect x="0" y="0" width="720" height="24" fill="#0F172A" rx="6 6 0 0"/>
  <circle cx="14" cy="12" r="4" fill="#EF4444"/>
  <circle cx="26" cy="12" r="4" fill="#F59E0B"/>
  <circle cx="38" cy="12" r="4" fill="#10B981"/>
  <text x="54" y="16" fill="#94A3B8" font-size="11" font-weight="600" font-family="monospace">Cisco Packet Tracer v8.2 · Real-Time Physical Workspace</text>
  <rect x="610" y="4" width="102" height="16" fill="#1E293B" rx="3"/>
  <text x="616" y="15" fill="#38BDF8" font-size="9.5" font-family="monospace">● Link Status: UP</text>
  
  <line x1="130" y1="100" x2="310" y2="100" stroke="#2563EB" stroke-width="2.5" /><polygon points="138,96 138,104 145,100" fill="#10B981"/><polygon points="302,96 302,104 295,100" fill="#10B981"/><text x="148" y="94" fill="#475569" font-size="9" font-weight="600" font-family="monospace">Gi0/0/1</text><text x="272" y="94" fill="#475569" font-size="9" font-weight="600" font-family="monospace">Gi0/0/1</text><rect x="155.0" y="82.0" width="130" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="220.0" y="95.0" text-anchor="middle" fill="#047857" font-size="9" font-weight="700" font-family="monospace">Primary Fiber (AD 1)</text>
  <path d="M 130 115 C 220 180, 220 180, 310 115" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="6,4"/>
  <rect x="160" y="150" width="130" height="18" rx="4" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/>
  <text x="225" y="163" text-anchor="middle" fill="#B45309" font-size="9" font-weight="700">Floating Backup (AD 10)</text>
  <line x1="380" y1="100" x2="520" y2="100" stroke="#059669" stroke-width="2.5" /><polygon points="388,96 388,104 395,100" fill="#10B981"/><polygon points="512,96 512,104 505,100" fill="#10B981"/><text x="398" y="94" fill="#475569" font-size="9" font-weight="600" font-family="monospace">Gi0/0/0</text><text x="482" y="94" fill="#475569" font-size="9" font-weight="600" font-family="monospace">WAN</text><rect x="385.0" y="82.0" width="130" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="450.0" y="95.0" text-anchor="middle" fill="#047857" font-size="9" font-weight="700" font-family="monospace">Default 0.0.0.0/0</text>
  
    <g transform="translate(70,70)" filter="url(#shadow)">
      <circle cx="35" cy="35" r="30" fill="#0284C7" stroke="#0369A1" stroke-width="2.5"/>
      <path d="M 20 35 L 50 35 M 35 20 L 35 50 M 23 23 L 47 47 M 23 47 L 47 23" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="35" cy="35" r="7" fill="#0284C7" stroke="#FFFFFF" stroke-width="2"/>
      <text x="35" y="77" text-anchor="middle" fill="#0F172A" font-size="11.5" font-weight="700">HQ-RTR</text>
      <text x="35" y="90" text-anchor="middle" fill="#64748B" font-size="9" font-family="monospace">10.1.1.1/30</text>
    </g>
  
    <g transform="translate(310,70)" filter="url(#shadow)">
      <circle cx="35" cy="35" r="30" fill="#0284C7" stroke="#0369A1" stroke-width="2.5"/>
      <path d="M 20 35 L 50 35 M 35 20 L 35 50 M 23 23 L 47 47 M 23 47 L 47 23" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="35" cy="35" r="7" fill="#0284C7" stroke="#FFFFFF" stroke-width="2"/>
      <text x="35" y="77" text-anchor="middle" fill="#0F172A" font-size="11.5" font-weight="700">Branch-RTR</text>
      <text x="35" y="90" text-anchor="middle" fill="#64748B" font-size="9" font-family="monospace">10.1.1.2/30</text>
    </g>
  
    <g transform="translate(520,75)" filter="url(#shadow)">
