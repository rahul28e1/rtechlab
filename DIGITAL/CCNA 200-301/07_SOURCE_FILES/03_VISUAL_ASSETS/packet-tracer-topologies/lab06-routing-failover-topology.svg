      <text x="58" y="42" text-anchor="middle" fill="#0369A1" font-size="11" font-weight="700">Internet ISP</text>
      <text x="58" y="53" text-anchor="middle" fill="#64748B" font-size="8.5" font-family="monospace">203.0.113.1</text>
    </g>

</svg>