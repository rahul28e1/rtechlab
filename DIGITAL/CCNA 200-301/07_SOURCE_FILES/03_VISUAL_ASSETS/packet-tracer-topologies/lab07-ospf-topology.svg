  <line x1="350" y1="100" x2="510" y2="100" stroke="#10B981" stroke-width="2.5" /><polygon points="358,96 358,104 365,100" fill="#10B981"/><polygon points="502,96 502,104 495,100" fill="#10B981"/><text x="368" y="94" fill="#475569" font-size="9" font-weight="600" font-family="monospace">Gi0/0/2</text><text x="472" y="94" fill="#475569" font-size="9" font-weight="600" font-family="monospace">Gi0/0/1</text><rect x="365.0" y="82.0" width="130" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="430.0" y="95.0" text-anchor="middle" fill="#047857" font-size="9" font-weight="700" font-family="monospace">10.0.0.4/30 (Cost 10)</text>
  <line x1="100" y1="135" x2="100" y2="160" stroke="#64748B" stroke-width="2.5" stroke-dasharray="4,4"/><polygon points="108,131 108,139 115,135" fill="#10B981"/><polygon points="92,156 92,164 85,160" fill="#10B981"/><text x="118" y="129" fill="#475569" font-size="9" font-weight="600" font-family="monospace">g0/0/0</text>
  <rect x="35" y="165" width="130" height="22" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
  <text x="100" y="180" text-anchor="middle" fill="#475569" font-size="9" font-weight="700">Passive LAN 192.168.10.0</text>
  
