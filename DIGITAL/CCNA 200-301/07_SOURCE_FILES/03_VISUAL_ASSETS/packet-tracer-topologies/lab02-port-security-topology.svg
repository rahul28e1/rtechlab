  <text x="616" y="15" fill="#38BDF8" font-size="9.5" font-family="monospace">● Link Status: UP</text>
  
  <line x1="130" y1="75" x2="330" y2="110" stroke="#10B981" stroke-width="2.5" /><polygon points="138,71 138,79 145,75" fill="#10B981"/><polygon points="322,106 322,114 315,110" fill="#10B981"/><text x="148" y="69" fill="#475569" font-size="9" font-weight="600" font-family="monospace">NIC</text><text x="292" y="104" fill="#475569" font-size="9" font-weight="600" font-family="monospace">Fa0/1</text><rect x="165.0" y="74.5" width="130" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="230.0" y="87.5" text-anchor="middle" fill="#047857" font-size="9" font-weight="700" font-family="monospace">Authorized MAC</text>
  <line x1="130" y1="155" x2="330" y2="110" stroke="#EF4444" stroke-width="2.5" /><polygon points="138,151 138,159 145,155" fill="#10B981"/><polygon points="322,106 322,114 315,110" fill="#10B981"/><text x="148" y="149" fill="#475569" font-size="9" font-weight="600" font-family="monospace">NIC</text><text x="292" y="104" fill="#475569" font-size="9" font-weight="600" font-family="monospace">Fa0/2</text><rect x="165.0" y="114.5" width="130" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="230.0" y="127.5" text-anchor="middle" fill="#047857" font-size="9" font-weight="700" font-family="monospace">Rogue Attacker</text>
  
    <g transform="translate(70,45)" filter="url(#shadow)">
