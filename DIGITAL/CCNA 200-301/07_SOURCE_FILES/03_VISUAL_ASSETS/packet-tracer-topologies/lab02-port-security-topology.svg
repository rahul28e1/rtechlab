      <rect x="9" y="9" width="42" height="26" fill="#38BDF8"/>
      <polygon points="22,39 38,39 42,47 18,47" fill="#64748B"/>
      <rect x="12" y="47" width="36" height="3" rx="1" fill="#475569"/>
